git:
  overrideGpg: true
gui:
  showNumstatInFilesView: true
  skipRewordInEditorWarning: true
  tabWidth: 2
  theme:
    activeBorderColor:
      - yellow
      - bold
    searchingActiveBorderColor:
      - yellow
      - bold
    inactiveBorderColor:
      - "#6e6a86"
      - bold
    selectedLineBgColor:
      - black
    authorColors:
      "*": magenta
  border: single
  nerdFontsVersion: "3"
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80
keybinding:
  files:
    viewResetOptions: <disabled>
customCommands:
  - key: "U"
    command: "git submodule update --init --recursive"
    context: "global"
    description: "Update submodules"
    loadingText: "Updating Submodules..."
    output: log
